name: EMERIONA GLOBAL C11 Partner Intelligence Verification
on:
  push:
    branches:
      - architecture/c11-partner-intelligence
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c11-partner-intelligence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert verification head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Platform Build
        run: npm run build
      - name: Web Build
        run: npm run build --workspace apps/web
      - name: Apply C11 D1 migration
        run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify C11 migration evidence
        run: npx wrangler d1 execute emeriona-global-db --remote --json --command="SELECT version FROM schema_migrations WHERE version='0009_partner_intelligence_foundation';" | jq -e '.[0].results[0].version == "0009_partner_intelligence_foundation"'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production Health
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok" and .service == "emeriona-global"'
      - name: Production Readiness and D1
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready" and .dependencies.database.status == "ok"'
      - name: Partner intelligence route protection
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://emeriona-global.emerionaglobal.workers.dev/api/v1/partners/analytics)" = '405'
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://emeriona-global.emerionaglobal.workers.dev/api/v1/partners/performance)" = '405'
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://emeriona-global.emerionaglobal.workers.dev/api/v1/partners/impact)" = '405'
      - name: Production partner intelligence smoke
        run: bash scripts/c11-partner-intelligence-smoke.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
