name: Restore Official Cover

on:
  push:
    paths:
      - ".github/workflows/restore-official-cover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download approved official cover
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/emeriona/emeriona-website/main/assets/covers/emeriona-global-cover-en.png" \
            -o /tmp/emeriona-global-cover-en.png
          file /tmp/emeriona-global-cover-en.png
          python - <<'PY'
          from PIL import Image
          p = "/tmp/emeriona-global-cover-en.png"
          im = Image.open(p)
          print("source_format=", im.format, "size=", im.size)
          assert im.size == (1536, 614), f"Unexpected dimensions: {im.size}"
          PY

      - name: Convert to production WebP
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = "/tmp/emeriona-global-cover-en.png"
          dst = "apps/web/assets/covers/emeriona-global-cover-en.webp"
          im = Image.open(src).convert("RGB")
          im.save(dst, "WEBP", quality=95, method=6)
          print("written:", dst, im.size)
          PY
          file apps/web/assets/covers/emeriona-global-cover-en.webp
          test -s apps/web/assets/covers/emeriona-global-cover-en.webp

      - name: Commit official cover
        run: |
          set -euo pipefail
          git config user.name "EMERIONA GLOBAL"
          git config user.email "emeriona.global@gmail.com"
          git add apps/web/assets/covers/emeriona-global-cover-en.webp
          if git diff --cached --quiet; then
            echo "Official cover already matches the restored source."
            exit 0
          fi
          git commit -m "fix(assets): restore official EMERIONA cover"
          git push origin main
