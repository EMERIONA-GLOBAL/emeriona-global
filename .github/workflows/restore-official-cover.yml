name: Restore Official Cover

on:
  push:
    paths:
      - ".github/workflows/restore-official-cover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EMERIONA GLOBAL
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout approved cover source
        uses: actions/checkout@v4
        with:
          repository: emeriona/emeriona-website
          ref: main
          path: old-emeriona-website
          sparse-checkout: |
            assets/covers/emeriona-global-cover-en.png
          sparse-checkout-cone-mode: false

      - name: Validate approved official cover
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          test -s old-emeriona-website/assets/covers/emeriona-global-cover-en.png
          python - <<'PY'
          from PIL import Image
          p = "old-emeriona-website/assets/covers/emeriona-global-cover-en.png"
          im = Image.open(p)
          print("source_format=", im.format, "size=", im.size)
          assert im.size == (1536, 614), f"Unexpected dimensions: {im.size}"
          PY

      - name: Convert official cover to production WebP
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          src = "old-emeriona-website/assets/covers/emeriona-global-cover-en.png"
          dst = "apps/web/assets/covers/emeriona-global-cover-en.webp"
          im = Image.open(src).convert("RGB")
          im.save(dst, "WEBP", quality=95, method=6)
          print("written:", dst, im.size)
          PY
          file apps/web/assets/covers/emeriona-global-cover-en.webp
          test -s apps/web/assets/covers/emeriona-global-cover-en.webp

      - name: Commit official cover
        run: |
          set -euo pipefail
          git config user.name "EMERIONA GLOBAL"
          git config user.email "emeriona.global@gmail.com"
          git add apps/web/assets/covers/emeriona-global-cover-en.webp
          if git diff --cached --quiet; then
            echo "Official cover already matches the restored source."
            exit 0
          fi
          git commit -m "fix(assets): restore official EMERIONA cover"
          git push origin main
