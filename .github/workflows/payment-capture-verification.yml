name: Payment Capture Production Verification

on:
  push:
    branches: [commercial-payment-capture]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build --workspace=@emeriona-global/web
      - run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok"'
      - run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready"'

      - name: Production capture smoke
        run: |
          RUN_ID="${GITHUB_RUN_ID}"
          TENANT="capture-${RUN_ID}"
          OTHER="capture-other-${RUN_ID}"
          echo "Production capture smoke executes against deployed canonical route."
          curl -fsS -X POST "https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/capture" -H "x-tenant-id: ${TENANT}" -H "x-actor-id: capture-verifier" -H "x-currency: USD" -H "content-type: application/json" -H "idempotency-key: capture-${RUN_ID}" -d '{"paymentId":"missing"}' -o /tmp/capture.json
          test "$(jq -r '.error.code' /tmp/capture.json)" = 'use_case_failed'
          STATUS=$(curl -sS -o /tmp/capture-other.json -w '%{http_code}' -X POST "https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/capture" -H "x-tenant-id: ${OTHER}" -H "x-actor-id: capture-verifier" -H "x-currency: USD" -H "content-type: application/json" -H "idempotency-key: capture-other-${RUN_ID}" -d '{"paymentId":"missing"}')
          test "${STATUS}" = '400'
