name: EMERIONA GLOBAL Quality Gates

on:
  push:
    branches: [main, 'architecture/**', 'security/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_write:
        description: 'Explicitly authorize C11 D1 migration, Worker deployment, and production smoke writes'
        type: choice
        required: true
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Platform Build
        run: npm run build
      - name: Web Build
        run: npm run build --workspace=@emeriona-global/web
