name: Payment Create Production Verification

on:
  push:
    branches: [commercial-payment-create-alignment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build --workspace=@emeriona-global/web
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production Health
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok" and .service == "emeriona-global"'
      - name: Production Readiness and D1
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready" and .dependencies.database.status == "ok"'
      - name: Route protection
        run: test "$(curl -sS -o /tmp/payment-method.json -w '%{http_code}' https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments)" = '405'
      - name: Production payment.create smoke
        run: bash scripts/payment-create-production-smoke.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production payment.authorize smoke
        run: |
          RUN_ID="${GITHUB_RUN_ID}"
          TENANT_ID="payment-verify-${RUN_ID}"
          PAYMENT_ID=$(npx wrangler d1 execute emeriona-global-db --remote --command="SELECT id FROM payment_intents WHERE tenant_id='${TENANT_ID}' ORDER BY rowid DESC LIMIT 1" --json | jq -r '.[]?.results[]?.id // empty' | head -n1)
          test -n "${PAYMENT_ID}"
          curl -fsS -X POST "https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/authorize" -H "x-tenant-id: ${TENANT_ID}" -H "x-actor-id: payment-verify-actor" -H "x-currency: USD" -H "content-type: application/json" -H "idempotency-key: payment-authorize-${RUN_ID}" -d "{\"paymentId\":\"${PAYMENT_ID}\"}" | tee /tmp/payment-authorize.json
          test "$(jq -r '.meta.useCaseId' /tmp/payment-authorize.json)" = 'payment.authorize'
          test "$(jq -r '.data.status' /tmp/payment-authorize.json)" = 'AUTHORIZED'
          curl -fsS -X POST "https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/authorize" -H "x-tenant-id: ${TENANT_ID}" -H "x-actor-id: payment-verify-actor" -H "x-currency: USD" -H "content-type: application/json" -H "idempotency-key: payment-authorize-${RUN_ID}" -d "{\"paymentId\":\"${PAYMENT_ID}\"}" | tee /tmp/payment-authorize-replay.json
          test "$(jq -r '.data.status' /tmp/payment-authorize-replay.json)" = 'AUTHORIZED'
          test "$(jq -r '.data.id' /tmp/payment-authorize-replay.json)" = "${PAYMENT_ID}"
          STATUS=$(curl -sS -o /tmp/payment-authorize-cross.json -w '%{http_code}' -X POST "https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/authorize" -H "x-tenant-id: payment-other-${RUN_ID}" -H "x-actor-id: payment-verify-actor" -H "x-currency: USD" -H "content-type: application/json" -H "idempotency-key: payment-authorize-cross-${RUN_ID}" -d "{\"paymentId\":\"${PAYMENT_ID}\"}")
          test "${STATUS}" = '400'
          npx wrangler d1 execute emeriona-global-db --remote --command="SELECT (SELECT count(*) FROM payment_intents WHERE id='${PAYMENT_ID}' AND tenant_id='${TENANT_ID}' AND status='AUTHORIZED') AS payment_ok, (SELECT count(*) FROM payment_events WHERE tenant_id='${TENANT_ID}' AND payment_intent_id='${PAYMENT_ID}' AND from_status='CREATED' AND to_status='AUTHORIZED') AS event_ok, (SELECT count(*) FROM idempotency_records WHERE tenant_id='${TENANT_ID}' AND use_case_id='payment.authorize' AND idempotency_key='payment-authorize-${RUN_ID}' AND status='COMPLETED') AS idempotency_ok, (SELECT count(*) FROM audit_events WHERE tenant_id='${TENANT_ID}' AND use_case_id='payment.authorize' AND outcome='SUCCEEDED') AS audit_ok;" | tee /tmp/payment-authorize-persistence.txt
          grep -q 'payment_ok.*1' /tmp/payment-authorize-persistence.txt
          grep -q 'event_ok.*1' /tmp/payment-authorize-persistence.txt
          grep -q 'idempotency_ok.*1' /tmp/payment-authorize-persistence.txt
          grep -q 'audit_ok.*1' /tmp/payment-authorize-persistence.txt
