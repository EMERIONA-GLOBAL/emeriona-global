name: Payment Status Production Verification

on:
  push:
    branches: [commercial-payment-status]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build --workspace=@emeriona-global/web
      - run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok"'
      - run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready"'
      - name: Payment status route protection
        run: |
          code=$(curl -sS -o /tmp/status.json -w '%{http_code}' -X GET https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/status)
          test "$code" = "405"
      - name: Payment status production smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute emeriona-global-db --remote --file scripts/payment-status-verification-seed.sql
          body=$(curl -fsS -X POST https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/status -H "x-tenant-id: status-verification-tenant" -H "x-actor-id: status-verifier" -H "x-currency: USD" -H "content-type: application/json" -d '{"paymentId":"status-verification-payment"}')
          echo "$body" | jq -e '.data.id == "status-verification-payment" and .data.status == "CAPTURED" and .data.amount.amount == 125 and .data.amount.currency == "USD" and .meta.useCaseId == "payment.status"'
          other=$(curl -sS -o /tmp/status-cross.json -w '%{http_code}' -X POST https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/status -H "x-tenant-id: status-verification-other" -H "x-actor-id: status-verifier" -H "x-currency: USD" -H "content-type: application/json" -d '{"paymentId":"status-verification-payment"}')
          test "$other" = "400"
          jq -e '.error.code == "use_case_failed"' /tmp/status-cross.json
