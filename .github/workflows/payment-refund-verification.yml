name: Payment Refund Production Verification

on:
  push:
    branches: [commercial-payment-refund, verify/payment-refund-main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build --workspace=@emeriona-global/web
      - run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok"'
      - run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready"'
      - name: Refund route protection
        run: |
          code=$(curl -sS -o /tmp/refund.json -w '%{http_code}' -X GET https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/refund)
          test "$code" = "405"
      - name: Payment refund production smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute emeriona-global-db --remote --file scripts/payment-refund-verification-seed.sql
          body=$(curl -fsS -X POST https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/refund -H "x-tenant-id: refund-verification-tenant" -H "x-actor-id: refund-verifier" -H "x-currency: USD" -H "content-type: application/json" -H "idempotency-key: refund-verification-key" -d '{"paymentId":"refund-verification-payment"}')
          echo "$body" | jq -e '.data.id == "refund-verification-payment" and .data.status == "REFUNDED" and .meta.useCaseId == "payment.refund"'
          replay=$(curl -fsS -X POST https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/refund -H "x-tenant-id: refund-verification-tenant" -H "x-actor-id: refund-verifier" -H "x-currency: USD" -H "content-type: application/json" -H "idempotency-key: refund-verification-key" -d '{"paymentId":"refund-verification-payment"}')
          echo "$replay" | jq -e '.data.id == "refund-verification-payment" and .data.status == "REFUNDED" and .meta.useCaseId == "payment.refund"'
          status=$(curl -sS -o /tmp/refund-cross.json -w '%{http_code}' -X POST https://emeriona-global.emerionaglobal.workers.dev/api/v1/payments/refund -H "x-tenant-id: refund-verification-other" -H "x-actor-id: refund-verifier" -H "x-currency: USD" -H "content-type: application/json" -H "idempotency-key: refund-verification-cross-key" -d '{"paymentId":"refund-verification-payment"}')
          test "$status" = "400"
          jq -e '.error.code == "use_case_failed"' /tmp/refund-cross.json
          evidence=$(npx wrangler d1 execute emeriona-global-db --remote --command "SELECT status FROM payment_intents WHERE id='refund-verification-payment'; SELECT status,reversed_at FROM revenue_entries WHERE payment_intent_id='refund-verification-payment'; SELECT from_status,to_status FROM payment_events WHERE payment_intent_id='refund-verification-payment' ORDER BY created_at DESC LIMIT 1;" --json)
          echo "$evidence" | jq -e 'tostring | contains("REFUNDED")'
          echo "$evidence" | jq -e 'tostring | contains("REVERSED")'
          echo "$evidence" | jq -e 'tostring | contains("CAPTURED") and contains("REFUNDED")'
