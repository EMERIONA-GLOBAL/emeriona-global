name: EMERIONA GLOBAL Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emeriona-global-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Worker and static assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | tee /tmp/health.json
          grep -Fq '"status":"ok"' /tmp/health.json
          grep -Fq '"service":"emeriona-global"' /tmp/health.json

      - name: Verify homepage and Market Center assets are live
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://emeriona-global.emerionaglobal.workers.dev"

          curl -fsS "$BASE_URL/?v=${GITHUB_SHA}" | tee /tmp/homepage.html
          grep -Fq 'class="hero hero-reference"' /tmp/homepage.html
          grep -Fq 'emeriona-global-cover-en.webp' /tmp/homepage.html
          grep -Fq 'id="commerce"' /tmp/homepage.html
          grep -Fq 'id="market-center-title"' /tmp/homepage.html
          grep -Fq 'Discover. Connect. Trade. Grow.' /tmp/homepage.html
          grep -Fq 'ONE SEARCH. CONNECTED MARKET.' /tmp/homepage.html
          grep -Fq 'mc-category-grid' /tmp/homepage.html
          grep -Fq 'mc-two-level' /tmp/homepage.html
          grep -Fq 'mc-featured' /tmp/homepage.html
          grep -Fq 'mc-connected' /tmp/homepage.html
          grep -Fq 'mc-feature-grid' /tmp/homepage.html
          grep -Fq 'mc-journey' /tmp/homepage.html
          grep -Fq 'mc-seller' /tmp/homepage.html
          grep -Fq 'market-recommendations' /tmp/homepage.html
          grep -Fq 'market-commercial' /tmp/homepage.html
          grep -Fq 'market-center.css' /tmp/homepage.html

          # The homepage must reference the deployed Market Center stylesheet; the repository/deploy
          # gate separately guarantees that the stylesheet is included in the Worker assets bundle.

          # The Market Center is data-driven: an empty catalog is a valid production state.
          # API lifecycle verification is covered by the dedicated commerce/catalog smoke suites.

          echo "Production homepage and Market Center verification passed."
