name: EMERIONA GLOBAL Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emeriona-global-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Worker and static assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | tee /tmp/health.json
          grep -Fq '"status":"ok"' /tmp/health.json
          grep -Fq '"service":"emeriona-global"' /tmp/health.json

      - name: Verify homepage and Market Center assets are live
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://emeriona-global.emerionaglobal.workers.dev"

          curl -fsS "$BASE_URL/?v=${GITHUB_SHA}" | tee /tmp/homepage.html
          grep -Fq 'class="hero hero-reference"' /tmp/homepage.html
          grep -Fq 'emeriona-global-cover-en.webp' /tmp/homepage.html
          grep -Fq 'id="commerce"' /tmp/homepage.html
          grep -Fq 'id="market-center-title"' /tmp/homepage.html
          grep -Fq 'market-recommendations' /tmp/homepage.html
          grep -Fq 'market-commercial' /tmp/homepage.html

          curl -fsS "$BASE_URL/discovery.html?v=${GITHUB_SHA}" -o /tmp/discovery.html
          grep -Fq 'discovery-page.css?v=20261004-visual-rebuild-v1' /tmp/discovery.html
          grep -Fq 'Discovery Gateway' /tmp/discovery.html

          curl -fsS -D /tmp/discovery-css.headers -o /tmp/discovery-page.css "$BASE_URL/discovery-page.css?v=${GITHUB_SHA}"
          grep -Eiq '^content-type: text/css(;|[[:space:]])' /tmp/discovery-css.headers
          grep -Fq '.discovery-gateway' /tmp/discovery-page.css
          grep -Fq '.ecosystem-path-card' /tmp/discovery-page.css
          grep -Fq '.gateway-results' /tmp/discovery-page.css

          # Verify the official cover is an actual deployed static asset, not only a source reference.
          curl -fsS "$BASE_URL/assets/covers/emeriona-global-cover-en.webp" -o /tmp/cover.webp
          test -s /tmp/cover.webp
          file --mime-type /tmp/cover.webp | grep -Eiq 'image/(webp|png|jpeg)'

          # The Market Center is data-driven: an empty catalog is a valid production state.
          # API lifecycle verification is covered by the dedicated commerce/catalog smoke suites.

          echo "Production homepage, Discovery, and Market Center verification passed."
