name: EMERIONA GLOBAL Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emeriona-global-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Worker and static assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | tee /tmp/health.json
          grep -Fq '"status":"ok"' /tmp/health.json
          grep -Fq '"service":"emeriona-global"' /tmp/health.json

      - name: Verify homepage and Market Center assets are live
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://emeriona-global.emerionaglobal.workers.dev"

          curl -fsS "$BASE_URL/?v=${GITHUB_SHA}" -o /tmp/homepage.html
          for marker in 'class="hero hero-reference"' 'emeriona-global-cover-en.webp' 'id="commerce"' 'id="market-center-title"' 'market-recommendations' 'market-commercial'; do
            grep -Fq "$marker" /tmp/homepage.html || { echo "Homepage verification failed: $marker"; exit 1; }
          done

          curl -fsS "$BASE_URL/discovery.html?v=${GITHUB_SHA}" -o /tmp/discovery.html
          for marker in 'discovery-page.css?v=20261004-visual-rebuild-v2' 'Discovery Gateway'; do
            grep -Fq "$marker" /tmp/discovery.html || { echo "Discovery HTML verification failed: $marker"; exit 1; }
          done

          curl -fsS -D /tmp/discovery-css.headers -o /tmp/discovery-page.css "$BASE_URL/discovery-page.css?v=${GITHUB_SHA}"
          echo "Discovery CSS response headers:"
          cat /tmp/discovery-css.headers
          grep -Eiq '^content-type: text/css(;|[[:space:]])' /tmp/discovery-css.headers || { echo "Discovery CSS verification failed: unexpected Content-Type"; exit 1; }
          for marker in '.discovery-gateway' '.ecosystem-path-card' '.gateway-results'; do
            grep -Fq "$marker" /tmp/discovery-page.css || { echo "Discovery CSS verification failed: $marker"; exit 1; }
          done

          # Verify the official cover is an actual deployed static asset, not only a source reference.
          curl -fsS "$BASE_URL/assets/covers/emeriona-global-cover-en.webp" -o /tmp/cover.webp
          test -s /tmp/cover.webp || { echo "Cover verification failed: empty payload"; exit 1; }
          node -e "const fs=require('fs');const b=fs.readFileSync('/tmp/cover.webp');const webp=b.length>=12&&b.subarray(0,4).toString()==='RIFF'&&b.subarray(8,12).toString()==='WEBP';if(!webp){console.error('Cover verification failed: invalid WebP signature, first bytes:',b.subarray(0,16).toString('hex'));process.exit(1)}"

          # The Market Center is data-driven: an empty catalog is a valid production state.
          # API lifecycle verification is covered by the dedicated commerce/catalog smoke suites.

          echo "Production homepage, Discovery, and Market Center verification passed."
