name: EMERIONA GLOBAL Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emeriona-global-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Worker and static assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"service":"emeriona-global"' /tmp/health.json

      - name: Verify homepage and Market Center assets are live
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://emeriona-global.emerionaglobal.workers.dev"

          curl -fsS "$BASE_URL/" | tee /tmp/homepage.html
          grep -q 'class="hero hero-reference"' /tmp/homepage.html
          grep -q 'emeriona-global-cover-en.webp' /tmp/homepage.html
          grep -q 'id="commerce"' /tmp/homepage.html
          grep -q 'EMERIONA GLOBAL MARKET CENTER' /tmp/homepage.html
          grep -q 'One Search. Connected Market.' /tmp/homepage.html
          grep -q 'market-center.css' /tmp/homepage.html

          # The homepage must reference the deployed Market Center stylesheet; the repository/deploy
          # gate separately guarantees that the stylesheet is included in the Worker assets bundle.
          grep -q 'market-center.css?v=20260927-market-center-v1' /tmp/homepage.html

          curl -fsS "$BASE_URL/api/v1/market/catalog?filter=all&limit=1" \
            -H 'x-tenant-id: emeriona-global' \
            -H 'x-actor-id: production-market-center-smoke' \
            -H 'x-currency: USD' | tee /tmp/market-catalog.json
          grep -q '"data"' /tmp/market-catalog.json
          grep -q '"items"' /tmp/market-catalog.json

          echo "Production homepage and Market Center verification passed."
