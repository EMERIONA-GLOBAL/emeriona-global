name: EMERIONA GLOBAL HA-1 Runtime Deployment Verification
on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Explicitly authorize HA-1 remote D1 migration and Worker deployment'
        type: choice
        required: true
        default: 'no'
        options:
          - 'no'
          - 'yes'
permissions:
  contents: read
concurrency:
  group: ha1-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy-verify:
    if: ${{ inputs.confirm_production_deploy == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert verification head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Platform Build
        run: npm run build
      - name: Web Build
        run: npm run build --workspace apps/web
      - name: Apply HA-1 D1 migration
        run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production Health
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok" and .service == "emeriona-global"'
      - name: Production Readiness and D1
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready" and .dependencies.database.status == "ok"'
