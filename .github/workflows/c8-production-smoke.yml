name: EMERIONA GLOBAL C8 Production Smoke
on:
  workflow_dispatch:
    inputs:
      confirm_production_smoke:
        description: 'Explicitly authorize C8 production smoke, including production data writes'
        type: choice
        required: true
        default: 'no'
        options:
          - 'no'
          - 'yes'
permissions:
  contents: read
jobs:
  smoke-c8:
    if: ${{ inputs.confirm_production_smoke == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Run C8 production smoke
        run: bash scripts/c8-partner-commerce-smoke.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
