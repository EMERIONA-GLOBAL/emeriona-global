name: EMERIONA GLOBAL C5 Production Smoke
on:
  workflow_dispatch:
    inputs:
      confirm_production_smoke:
        description: 'Explicitly authorize the C5 production smoke test'
        type: choice
        required: true
        default: 'no'
        options:
          - 'no'
          - 'yes'
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ inputs.confirm_production_smoke == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: chmod +x scripts/c5-fulfillment-smoke.sh && bash scripts/c5-fulfillment-smoke.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
