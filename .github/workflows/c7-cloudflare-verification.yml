name: EMERIONA GLOBAL C7 Cloudflare Verification
on:
  push:
    branches:
      - architecture/c7-pricing-promotions
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-c7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Apply D1 migration
        run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify health and readiness
        run: |
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready
      - name: Verify C7 schema
        run: npx wrangler d1 execute emeriona-global-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('price_quotes','promotion_events') ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
