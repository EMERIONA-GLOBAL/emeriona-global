name: Cart Update Production Verification

on:
  push:
    branches: [commercial-cart-update-api]
  pull_request:
    branches: [main]
    paths:
      - 'packages/application/src/**'
      - 'packages/domains/src/**'
      - 'packages/infrastructure/src/**'
      - 'packages/runtime/src/**'
      - 'scripts/cart-update-production-smoke.sh'
      - '.github/workflows/cart-update-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' || github.event.pull_request.number == 35
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification head
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert verification head
        run: test "$(git rev-parse HEAD)" = "\${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Platform Build
        run: npm run build
      - name: Web Build
        run: npm run build --workspace=@emeriona-global/web
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production Health
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok" and .service == "emeriona-global"'
      - name: Production Readiness and D1
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready" and .dependencies.database.status == "ok"'
      - name: Route protection
        run: test "$(curl -sS -o /tmp/cart-update-method.json -w '%{http_code}' https://emeriona-global.emerionaglobal.workers.dev/api/v1/carts/update)" = '405'
      - name: Production cart.update smoke
        run: bash scripts/cart-update-production-smoke.sh
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
