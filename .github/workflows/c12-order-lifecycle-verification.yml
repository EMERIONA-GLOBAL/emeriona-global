name: EMERIONA GLOBAL C12 Order Lifecycle Verification
# v1.0.2 — activated on default branch for post-merge production verification

on:
  push:
    branches:
      - main
      - architecture/c12-order-lifecycle

permissions:
  contents: read

jobs:
  verify-c12:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Quality Gates on this exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            runs="$(gh run list --workflow quality-gates.yml --limit 100 --json databaseId,headSha,status,conclusion,createdAt)"
            match="$(jq -c --arg sha "${GITHUB_SHA}" '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | reverse | .[0] // empty' <<<"${runs}")"
            if [[ -z "${match}" ]]; then
              echo "Quality Gates: no run found for exact head ${GITHUB_SHA} (attempt ${attempt}/60)"
              sleep 10
              continue
            fi

            run_id="$(jq -r '.databaseId' <<<"${match}")"
            status="$(jq -r '.status' <<<"${match}")"
            conclusion="$(jq -r '.conclusion // "null"' <<<"${match}")"
            echo "Quality Gates exact-head run ${run_id}: ${status}:${conclusion}"

            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                exit 0
              fi
              echo "Quality Gates did not pass for exact head ${GITHUB_SHA}"
              exit 1
            fi

            sleep 10
          done
          echo "Timed out waiting for Quality Gates success on exact head ${GITHUB_SHA}"
          exit 1

      - name: Checkout verified head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Apply C12 D1 migration
        run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify C12 schema
        run: |
          npx wrangler d1 execute emeriona-global-db --remote --json --command="SELECT version FROM schema_migrations WHERE version='0010_order_lifecycle_foundation';" | jq -e '.[0].results[0].version == "0010_order_lifecycle_foundation"'
          npx wrangler d1 execute emeriona-global-db --remote --json --command="SELECT name FROM sqlite_master WHERE type='table' AND name='order_events';" | jq -e '.[0].results[0].name == "order_events"'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy verified C12 runtime
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health and readiness
        run: |
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok" and .service == "emeriona-global"'
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready" and .dependencies.database.status == "ok"'

      - name: Execute isolated C12 order lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          TENANT="c12-proof-${GITHUB_RUN_ID}"
          CUSTOMER="customer-${GITHUB_RUN_ID}"
          ORDER="order-${GITHUB_RUN_ID}"
          cleanup() {
            npx wrangler d1 execute emeriona-global-db --remote --command="DELETE FROM order_events WHERE tenant_id='$TENANT'; DELETE FROM orders WHERE tenant_id='$TENANT'; DELETE FROM customers WHERE tenant_id='$TENANT'; DELETE FROM tenants WHERE id='$TENANT';" >/dev/null || true
          }
          trap cleanup EXIT

          npx wrangler d1 execute emeriona-global-db --remote --command="INSERT INTO tenants(id,name) VALUES ('$TENANT','C12 Verification Tenant'); INSERT INTO customers(id,tenant_id,display_name,status) VALUES ('$CUSTOMER','$TENANT','C12 Verification Customer','ACTIVE'); INSERT INTO orders(id,tenant_id,customer_id,status,total_amount,currency) VALUES ('$ORDER','$TENANT','$CUSTOMER','PENDING',100,'USD');"

          curl -fsS -X POST https://emeriona-global.emerionaglobal.workers.dev/api/v1/orders/update             -H "content-type: application/json"             -H "x-tenant-id: $TENANT"             -H "x-actor-id: c12-verifier"             -H "x-currency: USD"             -H "x-correlation-id: c12-${GITHUB_RUN_ID}"             -H "idempotency-key: c12-order-update-${GITHUB_RUN_ID}"             --data "{\"orderId\":\"$ORDER\",\"status\":\"CONFIRMED\"}" | tee /tmp/c12-response.json

          jq -e '.data.status == "CONFIRMED"' /tmp/c12-response.json
          npx wrangler d1 execute emeriona-global-db --remote --json --command="SELECT from_status,to_status,correlation_id FROM order_events WHERE tenant_id='$TENANT' AND order_id='$ORDER' ORDER BY created_at DESC LIMIT 1;" | jq -e '.[0].results[0].from_status == "PENDING" and .[0].results[0].to_status == "CONFIRMED"'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
