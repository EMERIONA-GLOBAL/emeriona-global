name: EMERIONA GLOBAL C10 Partner Offers Verification
on:
  push:
    branches:
      - architecture/c10-partner-offers
      - architecture/c10-hardening
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c10-partner-offers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert verification head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Platform Build
        run: npm run build
      - name: Web Build
        run: npm run build --workspace apps/web
      - name: Apply C10 D1 migration
        run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production Health
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok" and .service == "emeriona-global"'
      - name: Production Readiness and D1
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready" and .dependencies.database.status == "ok"'
      - name: Partner offer route protection
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://emeriona-global.emerionaglobal.workers.dev/api/v1/partners/offers)" = '405'
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://emeriona-global.emerionaglobal.workers.dev/api/v1/partners/offers/update)" = '405'
      - name: Production partner offer smoke
        run: bash scripts/c10-partner-offers-smoke.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
