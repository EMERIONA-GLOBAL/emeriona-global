name: Cart Item Add Main Exact Verification

on:
  push:
    branches: [verify/cart-item-add-main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Main merge SHA
        uses: actions/checkout@v4
        with:
          ref: f8c06aa3720352e5faa42f0477dde21fda569c91
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert exact Main merge SHA
        run: test "$(git rev-parse HEAD)" = "f8c06aa3720352e5faa42f0477dde21fda569c91"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Platform Build
        run: npm run build
      - name: Web Build
        run: npm run build --workspace=@emeriona-global/web
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply emeriona-global-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production Health
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | jq -e '.status == "ok" and .service == "emeriona-global"'
      - name: Production Readiness and D1
        run: curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | jq -e '.status == "ready" and .dependencies.database.status == "ok"'
      - name: Route protection
        run: test "$(curl -sS -o /tmp/cart-item-method.json -w '%{http_code}' https://emeriona-global.emerionaglobal.workers.dev/api/v1/cart-items)" = '405'
      - name: Production cart.item.add smoke
        run: bash scripts/cart-item-add-production-smoke.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
