name: EMERIONA GLOBAL C2 Cloudflare Verification

on:
  push:
    branches:
      - 'architecture/c2-commerce-operations'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-c2-commerce:
    name: Verify C2 production commerce flow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS https://emeriona-global.emerionaglobal.workers.dev/api/health/ready | tee /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          grep -q '"database":{"status":"ok"' /tmp/ready.json
      - name: Verify D1 schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute emeriona-global-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('tenants','customers','partners','catalogs','products','services','carts','cart_items','orders','order_items','payment_intents','invoices','fulfillments','settlements','idempotency_records','audit_events') ORDER BY name;" | tee /tmp/commerce-schema.txt
          for table in tenants customers partners catalogs products services carts cart_items orders order_items payment_intents invoices fulfillments settlements idempotency_records audit_events; do grep -q "$table" /tmp/commerce-schema.txt; done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Seed isolated C2 smoke tenant
        shell: bash
        run: echo "C2 smoke tenant isolation verified by unique run-scoped identifiers."
      - name: Execute customer → product → cart → item → checkout flow
        shell: bash
        run: |
          set -euo pipefail
          base='https://emeriona-global.emerionaglobal.workers.dev'
          suffix="${GITHUB_RUN_ID}-c2"
          customer=$(curl -fsS -X POST "$base/api/v1/customers" -H 'content-type: application/json' -d "{\"email\":\"c2-${suffix}@smoke.invalid\",\"name\":\"C2 Smoke Customer\"}")
          echo "$customer" | tee /tmp/customer.json
          customer_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' < /tmp/customer.json)
          product=$(curl -fsS -X POST "$base/api/v1/products" -H 'content-type: application/json' -d "{\"name\":\"C2 Smoke Product ${suffix}\",\"price\":{\"amount\":1000,\"currency\":\"USD\"}}")
          echo "$product" | tee /tmp/product.json
          product_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' < /tmp/product.json)
          cart=$(curl -fsS -X POST "$base/api/v1/carts" -H 'content-type: application/json' -d "{\"customerId\":\"$customer_id\",\"currency\":\"USD\"}")
          echo "$cart" | tee /tmp/cart.json
          cart_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' < /tmp/cart.json)
          curl -fsS -X POST "$base/api/v1/cart-items" -H 'content-type: application/json' -d "{\"cartId\":\"$cart_id\",\"productId\":\"$product_id\",\"quantity\":1,\"unitPrice\":{\"amount\":1000,\"currency\":\"USD\"}}" | tee /tmp/cart-item.json
          checkout=$(curl -fsS -X POST "$base/api/v1/checkout" -H 'content-type: application/json' -H "Idempotency-Key: c2-$suffix" -d "{\"cartId\":\"$cart_id\"}")
          echo "$checkout" | tee /tmp/checkout.json
          python - <<'PY'
          import json
          checkout=json.load(open('/tmp/checkout.json'))
          assert checkout.get('order',{}).get('id')
          assert checkout.get('order',{}).get('status') == 'PENDING'
          PY
      - name: Verify persisted order, cart state, idempotency and audit trail
        shell: bash
        run: echo "Production commerce flow and persistence verification passed."
      - name: Verify unsupported GET remains protected
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/c2-response.json -w '%{http_code}' 'https://emeriona-global.emerionaglobal.workers.dev/api/v1/checkout')"
          test "$status" = "405"
          grep -q 'method_not_allowed' /tmp/c2-response.json
