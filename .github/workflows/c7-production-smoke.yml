name: EMERIONA GLOBAL C7 Production Smoke
on:
  push:
    branches:
      - architecture/c7-pricing-promotions
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-c7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Run C7 production smoke
        run: bash scripts/c7-pricing-promotions-smoke.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
