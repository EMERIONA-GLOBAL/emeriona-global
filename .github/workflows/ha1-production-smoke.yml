name: EMERIONA GLOBAL HA-1 Production Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_production_smoke:
        description: 'Explicitly authorize running the HA-1 production smoke checks'
        type: choice
        required: true
        default: 'no'
        options:
          - 'no'
          - 'yes'

jobs:
  smoke:
    name: production-smoke
    if: ${{ inputs.confirm_production_smoke == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health
        run: |
          set -euo pipefail
          BASE_URL="https://emeriona-global.emerionaglobal.workers.dev"
          curl -fsS "$BASE_URL/api/health"

      - name: Verify production readiness
        run: |
          set -euo pipefail
          BASE_URL="https://emeriona-global.emerionaglobal.workers.dev"
          response="$(curl -fsS "$BASE_URL/api/health/ready")"
          echo "$response"
          echo "$response" | grep -q '"status":"ready"'
          echo "$response" | grep -q '"database":{"status":"ok"'
